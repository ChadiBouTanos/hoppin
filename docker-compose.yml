version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hoppin_backend
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 hoppin.wsgi:application
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
    expose:
      - 8000
    env_file:
      - ./backend/.env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: hoppin_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend
    restart: unless-stopped

volumes:
  static_volume: