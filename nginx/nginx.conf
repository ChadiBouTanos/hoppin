upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name hoppin.cloud www.hoppin.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hoppin.cloud www.hoppin.cloud;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/hoppin.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoppin.cloud/privkey.pem;

    # Backend API
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Images served by Django
    location /images/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SEO: dynamic sitemap + robots from Django
    location = /sitemap.xml {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /robots.txt {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Frontend - React SPA (must be last)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
